name: Unstick Pages deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  deployments: write
  actions: write
  id-token: write

jobs:
  unstick:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale GitHub Pages deployment
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const stuckSha = 'a971e6d8399ebe0364e04cc422b47be29a01ad89';

            // 1. 查询卡住的 Pages 部署状态
            try {
              const { data } = await github.request(
                'GET /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}',
                { owner, repo, pages_deployment_id: stuckSha }
              );
              core.info(`Pages deployment ${stuckSha} status: ${JSON.stringify(data)}`);
            } catch (e) {
              core.warning(`GET status failed: ${e.message}`);
            }

            // 2. 强制取消卡住的 Pages 部署，释放部署锁
            try {
              const res = await github.request(
                'POST /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}/cancel',
                { owner, repo, pages_deployment_id: stuckSha }
              );
              core.info(`Cancel result: HTTP ${res.status}`);
            } catch (e) {
              core.warning(`Cancel failed: ${e.message}`);
            }

            // 3. 清理 github-pages 环境里仍处于 in_progress 的普通 deployment
            try {
              const { data: deps } = await github.request(
                'GET /repos/{owner}/{repo}/deployments',
                { owner, repo, environment: 'github-pages', per_page: 20 }
              );
              for (const d of deps) {
                const { data: statuses } = await github.request(
                  'GET /repos/{owner}/{repo}/deployments/{deployment_id}/statuses',
                  { owner, repo, deployment_id: d.id, per_page: 1 }
                );
                const state = statuses.length ? statuses[0].state : 'none';
                core.info(`Deployment ${d.id} sha=${d.sha.slice(0, 7)} state=${state}`);
                if (state === 'in_progress' || state === 'queued' || state === 'waiting') {
                  try {
                    await github.request(
                      'DELETE /repos/{owner}/{repo}/deployments/{deployment_id}',
                      { owner, repo, deployment_id: d.id }
                    );
                    core.info(`Deleted stuck deployment ${d.id}`);
                  } catch (e) {
                    core.warning(`Delete ${d.id} failed: ${e.message}`);
                  }
                }
              }
            } catch (e) {
              core.warning(`List deployments failed: ${e.message}`);
            }
